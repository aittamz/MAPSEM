  <style>
    :root{
      color-scheme: light dark;
      --ui-bg: #ffffff;
      --ui-border: #e5e7eb;
      --ui-text: #111827;
      --ui-text-muted: #6b7280;
      --ui-hover: rgba(0,0,0,.04);
      --ui-active: rgba(0,0,0,.06);
    }

    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--ui-bg);
      color: var(--ui-text);
    }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
      background: var(--ui-bg);
      border-bottom: 1px solid var(--ui-border);
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--ui-text);
    }

    header a,
    header button{
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      padding: 6px 10px;
      border-radius: 10px;
      color: var(--ui-text);
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }
    header a:hover,
    header button:hover{ background: var(--ui-hover); }

    #wrap{
      height: calc(100vh - 54px);
      width: 100%;
      overflow: hidden;
      touch-action: none;
      background: var(--ui-bg);
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }
    #wrap:active{ cursor: grabbing; }

    #wrap svg{
      width: 100%;
      height: 100%;
      display: block;
      background: var(--ui-bg);
    }

    .hint{
      margin-left: auto;
      opacity: .75;
      font-size: 13px;
      color: var(--ui-text-muted);
    }

    /* --- LEGENDA --- */
    .legend{
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 9999;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,.10);
      font-size: 14px;
      line-height: 1.35;
      min-width: 210px;
      color: var(--ui-text);
    }
    .legend, .legend *{ color: var(--ui-text); }

    .legend-title{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 650;
      margin-bottom: 8px;
    }
    .legend-title small{
      color: var(--ui-text-muted);
      font-weight: 500;
    }

    .legend-item{
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .legend-item:hover{ background: var(--ui-hover); }
    .legend-item.active{
      border-color: var(--ui-border);
      background: var(--ui-active);
    }

    .legend-color{
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,.12);
    }

    .legend-actions{
      margin-top: 10px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .legend-actions button{
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--ui-text);
    }
    .legend-actions button:hover{ background: var(--ui-hover); }
  </style>

<script src="lingua.js"></script>

  <div class="ms-shell ms-heading"><p class="ms-kicker">04 / RELAZIONI</p><h1>Rete dei ruoli</h1><p>Ingrandisci la rete e spostati nel grafo. Seleziona un ruolo nella legenda per evidenziarlo.</p></div>
  <header>
    <button type="button" id="reset">Inquadra il grafo</button>
    <button type="button" id="graph-plus" aria-label="Ingrandisci il grafo">+</button>
    <button type="button" id="graph-minus" aria-label="Riduci il grafo">−</button>
    <span class="hint">Trascina per spostarti · Usa + e − per lo zoom</span>
  </header>

  <div id="wrap" aria-label="SVG viewer"></div>

  <!-- Legenda: colori "umani" (li possiamo lasciare come li vuoi tu) -->
  <div class="legend" id="legend">
    <div class="legend-title">
      <span>Legenda</span>
      <small>clicca un ruolo</small>
    </div>

    <button type="button" class="legend-item" data-color="#e6a6ff"><span class="legend-color" style="background:#e6a6ff"></span><span>compositore</span></button>
    <button type="button" class="legend-item" data-color="#7fd300"><span class="legend-color" style="background:#7fd300"></span><span>editore</span></button>
    <button type="button" class="legend-item" data-color="#00c4ff"><span class="legend-color" style="background:#00c4ff"></span><span>paroliere</span></button>
    <button type="button" class="legend-item" data-color="#4f4a45"><span class="legend-color" style="background:#4f4a45"></span><span>esecutore</span></button>
    <button type="button" class="legend-item" data-color="#ff8a00"><span class="legend-color" style="background:#ff8a00"></span><span>traduttore</span></button>
    <button type="button" class="legend-item" data-color="#ff4f87"><span class="legend-color" style="background:#ff4f87"></span><span>arrangiatore</span></button>
    <button type="button" class="legend-item" data-color="#00c389"><span class="legend-color" style="background:#00c389"></span><span>dedicatario</span></button>
    <button type="button" class="legend-item" data-color="#d7b8b2"><span class="legend-color" style="background:#d7b8b2"></span><span>direttore_orchestra</span></button>
    <button type="button" class="legend-item" data-color="#c9c9c9"><span class="legend-color" style="background:#c9c9c9"></span><span>riduttore</span></button>

    <div class="legend-actions">
      <button id="legend-showall" type="button">Mostra tutto</button>
    </div>
  </div>

  <script>
    const SVG_FILE = "mattia_test_2.svg";
    const wrap = document.getElementById("wrap");
    const resetBtn = document.getElementById("reset");

    let svgRef = null;

    // colori reali trovati sugli edges (Gephi)
    let EDGE_COLOR_PALETTE = [];

    // Camera
    let scale = 1, panX = 0, panY = 0;

    // Drag
    let isPanning = false, dragged = false;
    let lastX = 0, lastY = 0;
    let vx = 0, vy = 0;
    let inertiaRaf = null;

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
    function applyTransform(viewportG){
      viewportG.setAttribute("transform", `translate(${panX} ${panY}) scale(${scale})`);
    }
    function fitToView(svg, viewportG){
      if (!svg.getAttribute("viewBox")) {
        const bb = viewportG.getBBox();
        svg.setAttribute("viewBox", `${bb.x} ${bb.y} ${bb.width} ${bb.height}`);
      }
      scale = 1; panX = 0; panY = 0;
      applyTransform(viewportG);
    }

    function stopInertia(){
      if (inertiaRaf) cancelAnimationFrame(inertiaRaf);
      inertiaRaf = null;
    }
    function startInertia(viewportG){
      stopInertia();
      const step = () => {
        vx *= 0.90; vy *= 0.90;
        panX += vx;  panY += vy;
        applyTransform(viewportG);
        if (Math.abs(vx) + Math.abs(vy) > 0.25) inertiaRaf = requestAnimationFrame(step);
        else stopInertia();
      };
      inertiaRaf = requestAnimationFrame(step);
    }

    // ---------- Gephi edges/nodes selection ----------
    function getEdgeElements(svg){
      // Gephi: edges in <g id="edges"> ... <path stroke="#xxxxxx" ... />
      const edgesGroup = svg.querySelector("#edges");
      if (edgesGroup) {
        const els = edgesGroup.querySelectorAll("path, line, polyline");
        if (els.length) return Array.from(els);
      }
      // fallback
      return Array.from(svg.querySelectorAll("path, line, polyline"))
        .filter(el => !el.closest("#nodes"));
    }

    function getNodeGroupChildren(svg){
      const nodesGroup = svg.querySelector("#nodes");
      if (!nodesGroup) return [];
      return Array.from(nodesGroup.children).filter(x => x instanceof SVGElement);
    }

    // ---------- Color utils ----------
    function hexToRgb(hex){
      const h = hex.replace("#","").trim();
      const full = h.length === 3 ? h.split("").map(c => c+c).join("") : h;
      const n = parseInt(full, 16);
      return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
    }

    function rgbDistance(a, b){
      // distanza euclidea semplice (sufficiente qui)
      const dr = a.r - b.r, dg = a.g - b.g, db = a.b - b.b;
      return Math.sqrt(dr*dr + dg*dg + db*db);
    }

    function buildEdgePalette(svg){
      const edges = getEdgeElements(svg);
      const set = new Set();
      for (const e of edges) {
        const s = (e.getAttribute("stroke") || "").trim().toLowerCase();
        if (s && s !== "none") set.add(s);
      }
      EDGE_COLOR_PALETTE = Array.from(set);
      // console.log("Edge palette:", EDGE_COLOR_PALETTE);
    }

    function snapToNearestEdgeColor(hex){
      if (!EDGE_COLOR_PALETTE || EDGE_COLOR_PALETTE.length === 0) return hex.toLowerCase();
      const target = hexToRgb(hex);
      let best = EDGE_COLOR_PALETTE[0];
      let bestD = Infinity;
      for (const c of EDGE_COLOR_PALETTE) {
        if (!c.startsWith("#")) continue;
        const d = rgbDistance(target, hexToRgb(c));
        if (d < bestD) { bestD = d; best = c; }
      }
      return best; // colore reale dello SVG
    }

    // ---------- Filter: edges only ----------
    function showAll(){
      if (!svgRef) return;
      getEdgeElements(svgRef).forEach(e => e.style.opacity = "");
      getNodeGroupChildren(svgRef).forEach(n => n.style.opacity = "");
    }

    function filterEdgesByColor(requestedHex){
      if (!svgRef) return;

      const snapped = snapToNearestEdgeColor(requestedHex); // <-- magia: colore reale
      const edges = getEdgeElements(svgRef);
      const nodes = getNodeGroupChildren(svgRef);

      // nodi: discreti
      nodes.forEach(n => n.style.opacity = "0.18");

      // archi: fade
      edges.forEach(e => e.style.opacity = "0.04");

      // evidenzia solo archi col colore "snapped"
      let matched = 0;
      edges.forEach(e => {
        const s = (e.getAttribute("stroke") || "").trim().toLowerCase();
        if (s === snapped) {
          e.style.opacity = "1";
          matched++;
        }
      });

      // Debug (puoi togliere dopo)
      console.log("[Legend] requested:", requestedHex, "-> snapped:", snapped, "| matched:", matched);
    }

    // ---------- Legend click ----------
    const legendItems = Array.from(document.querySelectorAll(".legend-item"));
    const showAllBtn = document.getElementById("legend-showall");

    function setActive(item){
      legendItems.forEach(x => x.classList.remove("active"));
      if (item) item.classList.add("active");
    }

    legendItems.forEach(item => {
      item.addEventListener("click", () => {
        const color = item.getAttribute("data-color");
        const isActive = item.classList.contains("active");

        if (isActive) {
          setActive(null);
          showAll();
          return;
        }

        setActive(item);
        filterEdgesByColor(color);
      });
    });

    showAllBtn.addEventListener("click", () => {
      setActive(null);
      showAll();
    });

    // ---------- Load SVG + pan/zoom ----------
    async function loadSvg(){
      const res = await fetch(SVG_FILE, { cache: "no-store" });
      const text = await res.text();
      wrap.innerHTML = text;

      const svg = wrap.querySelector("svg");
      if (!svg) throw new Error("SVG non trovato nel file.");
      svgRef = svg;

      svg.removeAttribute("width");
      svg.removeAttribute("height");
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

      // Pan/zoom group
      let viewportG = svg.querySelector("#viewport");
      if (!viewportG) {
        viewportG = document.createElementNS("http://www.w3.org/2000/svg", "g");
        viewportG.setAttribute("id", "viewport");
        while (svg.firstChild) viewportG.appendChild(svg.firstChild);
        svg.appendChild(viewportG);
      }

      // costruisci palette colori edges (serve per snap)
      buildEdgePalette(svgRef);

      fitToView(svg, viewportG);

      // PAN
      wrap.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        isPanning = true;
        dragged = false;
        stopInertia();
        wrap.setPointerCapture(e.pointerId);
        lastX = e.clientX; lastY = e.clientY;
        vx = 0; vy = 0;
      });

      wrap.addEventListener("pointermove", (e) => {
        if (!isPanning) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        if (!dragged && Math.hypot(dx, dy) > 2) dragged = true;

        panX += dx; panY += dy;
        vx = vx * 0.6 + dx * 0.4;
        vy = vy * 0.6 + dy * 0.4;

        lastX = e.clientX; lastY = e.clientY;
        applyTransform(viewportG);
      });

      wrap.addEventListener("pointerup", () => {
        if (!isPanning) return;
        isPanning = false;
        if (dragged) startInertia(viewportG);
      });

      wrap.addEventListener("pointercancel", () => {
        isPanning = false;
        stopInertia();
      });

      wrap.addEventListener("click", (e) => {
        if (dragged) {
          e.preventDefault();
          e.stopPropagation();
          dragged = false;
        }
      }, true);

      // ZOOM
      wrap.addEventListener("wheel", (e) => {
        e.preventDefault();

        const rect = wrap.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;

        const prevScale = scale;
        const delta = -e.deltaY;

        const base = e.shiftKey ? 1.18 : 1.06;
        const zoomFactor = delta > 0 ? base : 1 / base;

        scale = clamp(scale * zoomFactor, 0.05, 60);

        panX = cx - (cx - panX) * (scale / prevScale);
        panY = cy - (cy - panY) * (scale / prevScale);

        applyTransform(viewportG);
      }, { passive: false });

      // RESET
      resetBtn.addEventListener("click", () => fitToView(svg, viewportG));
      function zoomBy(factor) {
        const { x, y, width, height } = svg.viewBox.baseVal;
        const centerX = x + width / 2;
        const centerY = y + height / 2;
        const nextScale = clamp(scale * factor, 0.05, 60);
        panX = centerX - (centerX - panX) * nextScale / scale;
        panY = centerY - (centerY - panY) * nextScale / scale;
        scale = nextScale;
        applyTransform(viewportG);
      }
      document.getElementById("graph-plus").addEventListener("click", () => zoomBy(1.35));
      document.getElementById("graph-minus").addEventListener("click", () => zoomBy(1 / 1.35));
    }

    loadSvg().catch(err => {
      wrap.innerHTML = `<p style="padding:12px">Errore: ${err.message}</p>`;
      console.error(err);
    });
  </script>
</body>
